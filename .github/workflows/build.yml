name: Zion OS CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zion-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  termux-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Zion bootstrap (aarch64)
        run: |
          chmod +x tools/termux/build_zion_bootstrap.sh
          tools/termux/build_zion_bootstrap.sh aarch64

      - name: Stage bootstrap
        run: |
          mkdir -p android/app/src/main/assets/termux
          cp build/termux-bootstrap/bootstrap-aarch64.zip android/app/src/main/assets/termux/bootstrap-aarch64.zip

      - name: Upload bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: zion-termux-bootstrap-aarch64
          path: build/termux-bootstrap/bootstrap-aarch64.zip
          if-no-files-found: error
          retention-days: 14

  quality:
    needs: termux-bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify project manifest is unchanged
        run: git diff --exit-code -- pubspec.yaml

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: zion-os-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
